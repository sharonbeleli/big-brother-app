<title>ביג ברדר</title>
<style>
:root{--bg:#f4f5fb;--panel:#fff;--text:#111827;--muted:#6b7280;--me:#4f46e5;--meText:#fff;--bot:#fff;--line:#e5e7eb;--chip:#eef2ff;--chipText:#3730a3;--accent:#4f46e5;--accent2:#7c3aed}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#121833;--text:#e5e7eb;--muted:#9ca3af;--bot:#1b2347;--line:#24305e;--chip:#1e2a5a;--chipText:#c7d2fe}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Rubik","Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(79,70,229,.35);z-index:2}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:.5px}
.title{flex:1;line-height:1.15}.title b{font-size:18px;display:block}.title small{opacity:.85;font-size:12px}
.online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;margin-left:4px}
#menuBtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:20px}
#menu{position:absolute;top:calc(64px + env(safe-area-inset-top));left:10px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:none;z-index:5;min-width:200px}
#menu.open{display:block}#menu button,#menu label{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;color:inherit;padding:10px;font-size:15px;text-align:right;border-radius:10px}
#menu button:hover{background:var(--chip)}#menu select{margin-right:auto;background:var(--chip);color:var(--text);border:0;border-radius:8px;padding:4px}
.progress{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px 10px}
.steps{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}.steps span.on{color:var(--accent);font-weight:700}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s ease}
#log{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.m{max-width:82%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;line-height:1.5;font-size:15.5px;animation:pop .22s ease;box-shadow:0 1px 2px rgba(0,0,0,.06);word-wrap:break-word}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bot{background:var(--bot);align-self:flex-start;border-bottom-right-radius:6px;border:1px solid var(--line)}
.me{background:var(--me);color:var(--meText);align-self:flex-end;border-bottom-left-radius:6px}
.note{align-self:center;max-width:92%;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:13px;text-align:center;box-shadow:none}
.insight{border-right:4px solid var(--accent2)}.analogy{font-style:italic;border-right:4px solid #f59e0b}
.summary{background:linear-gradient(135deg,rgba(79,70,229,.12),rgba(124,58,237,.12));border:1px solid rgba(124,58,237,.35)}
.empathy{border-right:4px solid #f97316}.handoff{border-right:4px solid #10b981}
.crisis{align-self:stretch;max-width:100%;background:#fff1f2;color:#7f1d1d;border:2px solid #f43f5e;border-radius:16px}
@media (prefers-color-scheme:dark){.crisis{background:#3b0a14;color:#fecdd3}}
.crisis .hl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:12px 14px;background:#e11d48;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;font-size:16px}
.crisis .hl.web{background:#9f1239}
.typing{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}#chips:empty{display:none}
.chip{flex:none;background:var(--chip);color:var(--chipText);border:1px solid transparent;border-radius:999px;padding:9px 14px;font-size:14.5px;font-weight:600}
.chip:active{transform:scale(.97)}
form{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#t{flex:1;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;outline:none}
#t:focus{border-color:var(--accent)}
#send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:19px;display:grid;place-items:center}
.safety{font-size:11.5px;color:var(--muted);text-align:center;padding:0 12px 4px}
</style></head><body>

<script>window.BB_CONTENT={"cases":[{"id":1,"topics":["business","career"],"keywords":["פוטרתי","פיטורים","רעיון","ייעוץ","עסק","לקוחות","שוק","אפליקציה"],"analogy":"היה מישהו שפוטר ורצה לפתוח שירות ייעוץ. במקום מחקר שוק, הוא בנה לעצמו כלי קטן, ניסה אותו על עצמו, והתחיל לקבל פידבק אמיתי."},{"id":2,"topics":["career"],"keywords":["לעזוב","עבודה","מנהל","ניהול","צוות","עובדים","תפקיד","קידום","להתפתח"],"analogy":"היה מישהו שעזב עבודה של 15 שנה – הכיוון היה נכון, אבל בתפקיד החדש הוא הגיע עם דרישות מהר מדי. מה שעבד: קודם להקשיב לאנשים ולתת להם בעלות, ורק אחר כך לדרוש."},{"id":3,"topics":["relationship"],"keywords":["זוגיות","להיפרד","גירושין","להתגרש","בן זוג","בת זוג","ריבים","אשתי","בעלי","חברה שלי","חבר שלי"],"analogy":"היה זוג שנפרד וחזר שוב ושוב במשך שנים. מה שהזיז משהו היה ההבנה שזוגיות נשחקת וצריך לתחזק אותה – ושכל אחד חווה משבר אחרת. היום הם שוב גרים יחד."},{"id":4,"topics":["family"],"keywords":["ילד","ילדה","הבת","הבן","הורים","אמא","אבא","גן","בית","טיפול","התנהגות","אח","אחות"],"analogy":"היה בית שבו אחת הילדות התחילה להתנהג אחרת. לפני שרצו לטיפול, בדקו מה השתנה – והתברר שהיא פשוט צריכה יותר תשומת לב מהורה אחד, בדרך שמתאימה דווקא לה. אחרי חודשיים זה השתנה מאוד."},{"id":5,"topics":["career","other"],"keywords":["צבא","גיוס","קבע","לימודים","תואר","לפרוש","קורס","מכינה","שירות"],"analogy":"היה בחור צעיר שרצה לפרוש מתוכנית בצבא כי חשב שזה מעכב אותו. במקום זה הוא ניצל את השירות ללמוד מקצוע – ואחרי כמה שנים היה צעד לפני כולם."},{"id":6,"topics":["business"],"keywords":["שותף","שותפות","חוזה","רווחים","כסף","מוצר","חנות","מכירות"],"analogy":"היה מישהו שפתח עסק עם שותף בלי חוזה, והרווחים התחלקו לא הוגן. הם הגיעו להסדר והשותף יצא – אבל הוא דאג לשמור על הקשר האישי גם בתוך המחלוקת."}],"flows":{"disclaimer":"לפני שמתחילים: אני בוט, לא בן אדם ולא איש מקצוע, ואני יכול לטעות. התשובה הנכונה נמצאת אצלך – התפקיד שלי לעזור לך למצוא אותה.","welcome":["היי! אני ביג ברדר 👋","אהלן, כאן ביג ברדר.","מה קורה? כאן ביג ברדר.","היי, טוב שבאת. אני ביג ברדר.","שלום שלום, ביג ברדר כאן 🙂"] זמן. מה הדבר הקטן והקונקרטי שתעשה השבוע?","רוב האנשים מגיעים למקום הנכון ובזמן הנכון – וחסר רק המעשה (מ-ז-ל). מה צעד אחד שאתה יכול לעשות כבר השבוע?","תכלס: מקום – יש. זמן – יש. מה המעשה הקטן הראשון? (מ-ז-ל)","אני מאמין שמזל זה מקום נכון, זמן נכון ולעשות מעשה. מה המעשה שלך השבוע?","הרבה אנשים נתקעים בדיוק פה – יודעים מה, ולא עושים. מה צעד אחד, קטן, עד סוף השבוע? (מ-ז-ל: מקום, זמן, לעשות)","מ׳ מקום, ז׳ זמן, ל׳ לעשות. נשאר לך רק ה-ל׳. מה זה יהיה?"],"ask_conclusion_direction":["אם הייתי צריך להגיד לך מה לעשות – הייתי מתחיל מהצעד שבחרת. אבל במילים שלך: מה המסקנה שלך?","אני שומע כיוון ברור. תגיד אותו במשפט אחד – מה המסקנה שלך?","אני אגיד לך מה אני הייתי עושה – אבל קודם, מה אתה מבין עכשיו?","תשמע, אני חושב שהדרך ברורה. תנסח אותה אתה – מה המסקנה?","בוא נסגור: במשפט אחד, מה אתה לוקח מפה?"],"ask_conclusion_validation":["נשמע שאתה כבר חושב על זה לעומק. במשפט אחד – מה המסקנה שלך?","אתה בכיוון. איך היית מסכם את המסקנה שלך?","נראה לי שאתה יודע את התשובה. תגיד אותה בקול?","אז מה אתה מבין עכשיו שלא הבנת בתחילת השיחה?","במילים שלך – לאן זה מוביל?"],"closing":["אז לסיכום, במילים שלך: \"{conclusion}\". הצעד הראשון: \"{action}\". זו ההחלטה שלך, ואני חושב שהיא באה ממקום טוב.","מה שאני לוקח מהשיחה – המסקנה שלך: \"{conclusion}\", והצעד: \"{action}\". תעשה אותו, ותספר לי בפעם הבאה.","{name_}זה שלך: \"{conclusion}\". והצעד: \"{action}\". אני סומך עליך.","יופי. המסקנה – \"{conclusion}\". הצעד – \"{action}\". קטן, ברור, אפשרי.","אז ככה, {name_}בלי הרבה מילים: \"{conclusion}\" → \"{action}\". נדבר אחרי שעשית?","זו לא העצה שלי, זו שלך: \"{conclusion}\". ומחר בבוקר: \"{action}\"."],"closing_execution":"וזכור: איך מבצעים חשוב כמו מה מחליטים – למשל, אם עוזבים, עוזבים יפה.","human_offer":"אם תרצה, אפשר לקבוע 5 דקות עם אח גדול אמיתי.","reverse_empathy":["אני מבין שאתה כועס, וזה לגיטימי. רגע לפני שאתה פועל מתוך זה – איך לדעתך זה ייראה מהצד השני? מה הם יחשבו ויזכרו?","בוא נעצור שנייה. אם תעשה את זה עכשיו מתוך כעס – מה יקרה מחר? ואיך הצד השני יראה אותך אחרי זה?","תעשה לי טובה, תן לזה לילה אחד. מחר עדיי <script>
(async function(){
const $=id=>document.getElementById(id),log=$('log'),chipsEl=$('chips'),t=$('t');
let C=window.BB_CONTENT;
if(!C){const [cases,flows]=await Promise.all([fetch('content/cases.json').then(r=>r.json()),fetch('content/flows.json').then(r=>r.json())]);C={cases,flows};}
let storage=null;try{storage=window.localStorage;storage.getItem('x')}catch(e){storage=null}
const memory=BBMemory.createMemory(storage);
const DELAY=window.BB_TEST?0:1;
let eng=new BBEngine.Engine({content:C,memory,country:$('cc').value});
window.bbEngine=eng;
const STEP={acquaint:0,welcome:0,topic:1,questions:2,reflection:3,luck:4,closing:5,done:5,crisis:5};
function setProgress(r){$('bar').style.width=r.progress+'%';[...$('steps').children].forEach((s,i)=>s.classList.toggle('on',i===STEP[r.stage]));}
function bubble(m,cls){const d=document.createElement('div');d.className='m '+cls+(m.kind?' '+m.kind:'');d.textContent=m.text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function hotlines(d,list){list.forEach(h=>{const a=document.createElement('a');a.className='hl'+(h.url?' web':'');a.href=h.phone?'tel:'+h.phone:h.url;if(h.url)a.target='_blank';a.innerHTML='<span></span><span>'+(h.phone?'📞 '+h.phone:'🌐')+'</span>';a.firstChild.textContent=h.name;d.appendChild(a);});}
let busy=Promise.resolve();
function render(r){busy=busy.then(async()=>{chipsEl.innerHTML='';
  for(const m of r.messages){if(DELAY){const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';log.appendChild(ty);log.scrollTop=log.scrollHeight;
    await new Promise(x=>setTimeout(x,Math.min(1400,350+m.text.length*12)));ty.remove();}
    const d=bubble(m,m.kind==='note'?'':'bot');if(m.kind==='note')d.className='m note';
    if(r.crisis&&r.crisis.hotlines&&(m.kind==='crisis'||r.crisis.reminder)){if(r.crisis.reminder)d.classList.add('crisis');hotlines(d,r.crisis.hotlines);d.dataset.level=r.crisis.level;}}
  (r.chips||[]).forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=c.label;b.onclick=()=>send(c.value,c.label);chipsEl.appendChild(b);});
  setProgress(r);});return busy;}
function send(v,label){if(!v)return;bubble({text:label||v},'me');const r=eng.handle(v);if(r.handoff&&r.handoff.ok&&window.BBAuth)window.BBAuth.onHandoff(eng,{auto:v!=='action:human'});window.bbLast=render(r);return window.bbLast;}
window.bbSend=send;
$('f').onsubmit=e=>{e.preventDefault();const v=t.value.trim();t.value='';send(v);};
$('menuBtn').onclick=()=>$('menu').classList.toggle('open');
$('newBtn').onclick=()=>{$('menu').classList.remove('open');send('action:new','נושא חדש');};
$('humanBtn').onclick=()=>{$('menu').classList.remove('open');send('action:human','לדבר עם בן אדם');};
$('cc').onchange=()=>{eng.country=$('cc').value;};
$('forgetBtn').onclick=()=>{$('menu').classList.remove('open');memory.forget();log.innerHTML='';eng=new BBEngine.Engine({content:C,memory,country:$('cc').value});window.bbEngine=eng;bubble({text:'מחקתי את כל מה שזכרתי עליך.'},'m note');window.bbLast=render(eng.start());};
window.bbRestart=()=>{log.innerHTML='';eng=new BBEngine.Engine({content:C,memory,country:$('cc').value});window.bbEngine=eng;window.bbLast=render(eng.start());};
window.bbReady=render(eng.start());
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.BB_CONTENT)navigator.serviceWorker.register('sw.js');
})();

const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const gate=document.createElement('div');gate.id='gate';document.body.appendChild(gate);
const HOT='<div class="hot">במצוקה? ער"ן <a href="tel:1201">1201</a> · מד"א <a href="tel:101">101</a> · משטרה <a href="tel:100">100</a></div>';
const PRIV='<div class="priv">🔒 הודעת פרטיות (טיוטה): אנחנו שומרים רק פרטים כלליים (כמו שם וגיל) כדי להתאים את השיחה. תוכן הדילמות לא נשמר בשרת — חוץ מסיכום קצר וכללי אם ביקשת לדבר עם בן אדם. אפשר לבקש מחיקה בכל עת. <i>[טיוטה – ממתין לבדיקת עו״ד]</i></div>';
const el=(h)=>{gate.innerHTML='<div class="card">'+h+'</div>'+HOT;gate.style.display='flex';return gate;};
const $=s=>gate.querySelector(s);let sb,user,prof;
async function api(path,opts){const s=(await sb.auth.getSession()).data.session;return fetch(path,Object.assign({headers:{Authorization:'Bearer '+(s&&s.access_token),'Content-Type':'application/json'}},opts||{})).then(r=>r.json());}
function login(mode){
 el(`<h1>ביג ברדר</h1><p>${mode==='up'?'פותחים חשבון – 7 ימי ניסיון חינם.':'ברוך שובך! מתחברים.'}</p>
 <input id="em" type="email" autocomplete="email" placeholder="אימייל" dir="ltr"><input id="pw" type="password" autocomplete="${mode==='up'?'new-password':'current-password'}" placeholder="סיסמה (8+ תווים)" dir="ltr">
 <div class="err" id="er"></div><button class="p" id="go">${mode==='up'?'הרשמה':'כניסה'}</button>
 <button class="s" id="gg">המשך עם Google</button><button class="lnk" id="sw">${mode==='up'?'כבר יש לי חשבון – כניסה':'אין חשבון? להרשמה'}</button>${mode==='up'?PRIV:''}`);
 $('#sw').onclick=()=>login(mode==='up'?'in':'up');
 $('#gg').onclick=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/'}});if(error)$('#er').textContent='התחברות עם Google עוד לא זמינה';};
 $('#go').onclick=async()=>{const email=$('#em').value.trim(),password=$('#pw').value;$('#er').textContent='';
  const r=mode==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){$('#er').textContent=mode==='up'?'ההרשמה נכשלה: '+r.error.message:'אימייל או סיסמה שגויים';return;}
  if(!r.data.session){$('#er').textContent='שלחנו לך מייל לאישור. אשר/י ואז התחבר/י.';return;} after();};
}
function onboarding(){const ans={};let i=0;
 const show=()=>{if(i>=Q.length)return finish();const q=Q[i];let sel=q.multi?[]:null;
  el(`<p>שאלה ${i+1} מתוך ${Q.length} · רק פרטים כלליים</p><h1 style="font-size:20px">${q.q}</h1>${q.type==='text'?'<input id="tx" maxlength="24">':'<div class="opts" id="op"></div>'}
  <button class="p" id="nx">הבא</button><button class="lnk" id="sk">דלג</button>`);
  if(q.opts)q.opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(q.multi){b.classList.toggle('on');sel=[...$('#op').children].filter(x=>x.classList.contains('on')).map(x=>x.textContent);}else{sel=o;[...$('#op').children].forEach(x=>x.classList.toggle('on',x===b));}};$('#op').appendChild(b);});
  $('#nx').onclick=()=>{const v=q.type==='text'?$('#tx').value.trim():sel;if(v&&(!Array.isArray(v)||v.length))ans[q.k]=v;i++;show();};
  $('#sk').onclick=()=>{i++;show();};};
 const finish=async()=>{await sb.from('profiles').update({onboarding:ans,onboarding_done:true}).eq('id',user.id);prof.onboarding=ans;prof.onboarding_done=true;feed(ans,true);after();};
 show();}
// Feed general details into the existing local memory/personalisation.
function feed(a,restart){try{const m=BBMemory.createMemory(window.localStorage);const p={};
 if(a.name)p.name=a.name;if(a.ageRange)p.ageRange=a.ageRange;if(a.occupation)p.occupation=a.occupation;
 if(a.tone==='ישיר ותכל׳ס')p.preferredStyle='direction';if(a.tone==='תומך ורגוע')p.preferredStyle='validation';
 const cur=m.load()||{};if(Object.keys(p).some(k=>cur[k]!==p[k])||restart){m.save(p);if(window.bbRestart)window.bbRestart();}}catch(e){}}
function daysLeft(){return Math.ceil((new Date(prof.trial_started_at).getTime()+prof.trial_days*864e5-Date.now())/864e5);}
function paywall(){el(`<h1>תקופת הניסיון הסתיימה</h1><p>תודה שניסית את ביג ברדר! 💜</p><h1 style="font-size:20px">תשלום יגיע בקרוב</h1><p>אנחנו עובדים על אפשרות מנוי. בינתיים אפשר לפנות אלינו להארכה.</p><button class="s" id="lo">התנתקות</button>`);$('#lo').onclick=logout;}
async function logout(){await sb.auth.signOut();location.reload();}
async function after(){
 user=(await sb.auth.getUser()).data.user;if(!user)return login('up');
 const b=await api('/api/bootstrap',{method:'POST'});prof=b.profile;if(!prof){el('<p>שגיאה בטעינת הפרופיל, נסה/י לרענן.</p>');return;}
 if(!prof.onboarding_done)return onboarding();
 feed(prof.onboarding||{},false);
 const d=daysLeft();if(d<=0&&!prof.is_admin)return paywall();
 gate.style.display='none';const t=document.querySelector('.title small');let bd=document.getElementById('trialBadge');
 if(!bd){bd=document.createElement('span');bd.id='trialBadge';t.appendChild(bd);}bd.textContent=prof.is_admin?'מנהל':'נשארו '+d+' ימי ניסיון';
 const menu=document.getElementById('menu');if(!document.getElementById('logoutBtn')){const lo=document.createElement('button');lo.id='logoutBtn';lo.textContent='🚪 התנתקות';lo.onclick=logout;menu.appendChild(lo);
  if(prof.is_admin){const ad=document.createElement('button');ad.textContent='🛠️ ניהול';ad.onclick=()=>location.href='/admin';menu.appendChild(ad);}}
}
// Handoff: store a SHORT neutral summary server-side (admin-only). No free text from the conversation.
const TOPIC={career:'קריירה',business:'עסק',relationship:'זוגיות',family:'משפחה',other:'אחר'};
window.BBAuth={onHandoff:async function(eng,res){try{if(!sb||!user)return;const o=(prof&&prof.onboarding)||{};
 const summary={profile:{name:o.name||null,ageRange:o.ageRange||null,occupation:o.occupation||null,tone:o.tone||null},
  theme:TOPIC[eng.s.topic]||null,subtheme:eng.s.sub||null,stage:eng.s.stage,auto:!!(res&&res.auto),turns:eng.turns.length,
  note:'המשתמש/ת ביקש/ה לדבר עם בן אדם'+(eng.s.topic?' בנושא '+(TOPIC[eng.s.topic]||''):'')};
 await sb.from('handoffs').insert({user_id:user.id,summary});}catch(e){}}};
(async()=>{el('<p>טוען...</p>');try{const c=await fetch('/api/config').then(r=>r.json());
 sb=window.supabase.createClient(c.url,c.anonKey);window.bbSupabase=sb;
 const s=(await sb.auth.getSession()).data.session;if(s)after();else login('up');}catch(e){el('<p>אין חיבור לשרת כרגע.</p>');}})();
})();
</script></body></html>
