<title>ביג ברדר</title>
<style>
:root{--bg:#f4f5fb;--panel:#fff;--text:#111827;--muted:#6b7280;--me:#4f46e5;--meText:#fff;--bot:#fff;--line:#e5e7eb;--chip:#eef2ff;--chipText:#3730a3;--accent:#4f46e5;--accent2:#7c3aed}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#121833;--text:#e5e7eb;--muted:#9ca3af;--bot:#1b2347;--line:#24305e;--chip:#1e2a5a;--chipText:#c7d2fe}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Rubik","Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(79,70,229,.35);z-index:2}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:.5px}
.title{flex:1;line-height:1.15}.title b{font-size:18px;display:block}.title small{opacity:.85;font-size:12px}
.online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;margin-left:4px}
#menuBtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:20px}
#menu{position:absolute;top:calc(64px + env(safe-area-inset-top));left:10px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:none;z-index:5;min-width:200px}
#menu.open{display:block}#menu button,#menu label{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;color:inherit;padding:10px;font-size:15px;text-align:right;border-radius:10px}
#menu button:hover{background:var(--chip)}#menu select{margin-right:auto;background:var(--chip);color:var(--text);border:0;border-radius:8px;padding:4px}
.progress{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px 10px}
.steps{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}.steps span.on{color:var(--accent);font-weight:700}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s ease}
#log{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.m{max-width:82%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;line-height:1.5;font-size:15.5px;animation:pop .22s ease;box-shadow:0 1px 2px rgba(0,0,0,.06);word-wrap:break-word}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bot{background:var(--bot);align-self:flex-start;border-bottom-right-radius:6px;border:1px solid var(--line)}
.me{background:var(--me);color:var(--meText);align-self:flex-end;border-bottom-left-radius:6px}
.note{align-self:center;max-width:92%;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:13px;text-align:center;box-shadow:none}
.insight{border-right:4px solid var(--accent2)}.analogy{font-style:italic;border-right:4px solid #f59e0b}
.summary{background:linear-gradient(135deg,rgba(79,70,229,.12),rgba(124,58,237,.12));border:1px solid rgba(124,58,237,.35)}
.empathy{border-right:4px solid #f97316}.handoff{border-right:4px solid #10b981}
.crisis{align-self:stretch;max-width:100%;background:#fff1f2;color:#7f1d1d;border:2px solid #f43f5e;border-radius:16px}
@media (prefers-color-scheme:dark){.crisis{background:#3b0a14;color:#fecdd3}}
.crisis .hl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:12px 14px;background:#e11d48;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;font-size:16px}
.crisis .hl.web{background:#9f1239}
.typing{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}#chips:empty{display:none}
.chip{flex:none;background:var(--chip);color:var(--chipText);border:1px solid transparent;border-radius:999px;padding:9px 14px;font-size:14.5px;font-weight:600}
.chip:active{transform:scale(.97)}
form{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#t{flex:1;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;outline:none}
#t:focus{border-color:var(--accent)}
#send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:19px;display:grid;place-items:center}
.safety{font-size:11.5px;color:var(--muted);text-align:center;padding:0 12px 4px}
</style></head><body>

<script>window.BB_CONTENT={"cases":[{"id":1,"topics":["business","career"],"keywords":["פוטרתי","פיטורים","רעיון","ייעוץ","עסק","לקוחות","שוק","אפליקציה"],"analogy":"היה מישהו שפוטר ורצה לפתוח שירות ייעוץ. במקום מחקר שוק, הוא בנה לעצמו כלי קטן, ניסה אותו על עצמו, והתחיל לקבל פידבק אמיתי."},{"id":2,"topics":["career"],"keywords":["לעזוב","עבודה","מנהל","ניהול","צוות","עובדים","תפקיד","קידום","להתפתח"],"analogy":"היה מישהו שעזב עבודה של 15 שנה – הכיוון היה נכון, אבל בתפקיד החדש הוא הגיע עם דרישות מהר מדי. מה שעבד: קודם להקשיב לאנשים ולתת להם בעלות, ורק אחר כך לדרוש."},{"id":3,"topics":["relationship"],"keywords":["זוגיות","להיפרד","גירושין","להתגרש","בן זוג","בת זוג","ריבים","אשתי","בעלי","חברה שלי","חבר שלי"],"analogy":"היה זוג שנפרד וחזר שוב ושוב במשך שנים. מה שהזיז משהו היה ההבנה שזוגיות נשחקת וצריך לתחזק אותה – ושכל אחד חווה משבר אחרת. היום הם שוב גרים יחד."},{"id":4,"topics":["family"],"keywords":["ילד","ילדה","הבת","הבן","הורים","אמא","אבא","גן","בית","טיפול","התנהגות","אח","אחות"],"analogy":"היה בית שבו אחת הילדות התחילה להתנהג אחרת. לפני שרצו לטיפול, בדקו מה השתנה – והתברר שהיא פשוט צריכה יותר תשומת לב מהורה אחד, בדרך שמתאימה דווקא לה. אחרי חודשיים זה השתנה מאוד."},{"id":5,"topics":["career","other"],"keywords":["צבא","גיוס","קבע","לימודים","תואר","לפרוש","קורס","מכינה","שירות"],"analogy":"היה בחור צעיר שרצה לפרוש מתוכנית בצבא כי חשב שזה מעכב אותו. במקום זה הוא ניצל את השירות ללמוד מקצוע – ואחרי כמה שנים היה צעד לפני כולם."},{"id":6,"topics":["business"],"keywords":["שותף","שותפות","חוזה","רווחים","כסף","מוצר","חנות","מכירות"],"analogy":"היה מישהו שפתח עסק עם שותף בלי חוזה, והרווחים התחלקו לא הוגן. הם הגיעו להסדר והשותף יצא – אבל הוא דאג לשמור על הקשר האישי גם בתוך המחלוקת."}],"flows":{"disclaimer":"לפני שמתחילים: אני בוט, לא בן אדם ולא איש מקצוע, ואני יכול לטעות. התשובה הנכונה נמצאת אצלך – התפקיד שלי לעזור לך למצוא אותה.","welcome":["היי! אני ביג ברדר 👋","אהלן, כאן ביג ברדר.","מה קורה? כאן ביג ברדר.","היי, טוב שבאת. אני ביג ברדר.","שלום שלום, ביג ברדר כאן 🙂"] זמן. מה הדבר הקטן והקונקרטי שתעשה השבוע?","רוב האנשים מגיעים למקום הנכון ובזמן הנכון – וחסר רק המעשה (מ-ז-ל). מה צעד אחד שאתה יכול לעשות כבר השבוע?","תכלס: מקום – יש. זמן – יש. מה המעשה הקטן הראשון? (מ-ז-ל)","אני מאמין שמזל זה מקום נכון, זמן נכון ולעשות מעשה. מה המעשה שלך השבוע?","הרבה אנשים נתקעים בדיוק פה – יודעים מה, ולא עושים. מה צעד אחד, קטן, עד סוף השבוע? (מ-ז-ל: מקום, זמן, לעשות)","מ׳ מקום, ז׳ זמן, ל׳ לעשות. נשאר לך רק ה-ל׳. מה זה יהיה?"],"ask_conclusion_direction":["אם הייתי צריך להגיד לך מה לעשות – הייתי מתחיל מהצעד שבחרת. אבל במילים שלך: מה המסקנה שלך?","אני שומע כיוון ברור. תגיד אותו במשפט אחד – מה המסקנה שלך?","אני אגיד לך מה אני הייתי עושה – אבל קודם, מה אתה מבין עכשיו?","תשמע, אני חושב שהדרך ברורה. תנסח אותה אתה – מה המסקנה?","בוא נסגור: במשפט אחד, מה אתה לוקח מפה?"],"ask_conclusion_validation":["נשמע שאתה כבר חושב על זה לעומק. במשפט אחד – מה המסקנה שלך?","אתה בכיוון. איך היית מסכם את המסקנה שלך?","נראה לי שאתה יודע את התשובה. תגיד אותה בקול?","אז מה אתה מבין עכשיו שלא הבנת בתחילת השיחה?","במילים שלך – לאן זה מוביל?"],"closing":["אז לסיכום, במילים שלך: \"{conclusion}\". הצעד הראשון: \"{action}\". זו ההחלטה שלך, ואני חושב שהיא באה ממקום טוב.","מה שאני לוקח מהשיחה – המסקנה שלך: \"{conclusion}\", והצעד: \"{action}\". תעשה אותו, ותספר לי בפעם הבאה.","{name_}זה שלך: \"{conclusion}\". והצעד: \"{action}\". אני סומך עליך.","יופי. המסקנה – \"{conclusion}\". הצעד – \"{action}\". קטן, ברור, אפשרי.","אז ככה, {name_}בלי הרבה מילים: \"{conclusion}\" → \"{action}\". נדבר אחרי שעשית?","זו לא העצה שלי, זו שלך: \"{conclusion}\". ומחר בבוקר: \"{action}\"."],"closing_execution":"וזכור: איך מבצעים חשוב כמו מה מחליטים – למשל, אם עוזבים, עוזבים יפה.","human_offer":"אם תרצה, אפשר לקבוע 5 דקות עם אח גדול אמיתי.","reverse_empathy":["אני מבין שאתה כועס, וזה לגיטימי. רגע לפני שאתה פועל מתוך זה – איך לדעתך זה ייראה מהצד השני? מה הם יחשבו ויזכרו?","בוא נעצור שנייה. אם תעשה את זה עכשיו מתוך כעס – מה יקרה מחר? ואיך הצד השני יראה אותך אחרי זה?","תעשה לי טובה, תן לזה לילה אחד. מחר עדיי  gate.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>checkout(b.dataset.buy));
 const bk=$('#back');if(bk)bk.onclick=()=>{gate.style.display='none';};$('#lo').onclick=logout;
 const uc=$('#useCr');if(uc)uc.onclick=async()=>{uc.disabled=true;const r=await sb.rpc('request_handoff',{});const ok=r.data&&r.data.ok;if(r.data&&r.data.status)acc=r.data.status;
  alert(ok?'הבקשה נשלחה! אח גדול יחזור אליך תוך 24 שעות.':'לא ניתן לשלוח כרגע.');plans(acc&&acc.active?'מנוי ושיחות':'תקופת הניסיון הסתיימה');};}
function paywall(){return plans('תקופת הניסיון הסתיימה');}
// Simulated checkout: no card fields at all. The server (service role, PAYMENTS_MODE=mock) creates the subscription/credit.
async function checkout(id){const p=await payInfo();const it=(p.products||[]).find(x=>x.id===id);if(!it||!p.enabled)return;
 const idem=(crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
 el(`<h1>תשלום – הדמיה</h1><p class="mk">🧪 מצב בדיקה: זה לא תשלום אמיתי. לא נדרשים פרטי כרטיס ולא נגבה כסף.</p>
 <div class="pl"><b>${it.label}</b><p>סכום להדמיה: ${fmtP(it.amount)}${it.kind==='subscription'?' לחודש':''}</p></div>
 <button class="p" id="pay">אישור תשלום (הדמיה)</button><button class="s" id="cx">ביטול</button>`);
 $('#cx').onclick=()=>plans(acc&&acc.active?'מנוי ושיחות':'תקופת הניסיון הסתיימה');
 $('#pay').onclick=async()=>{const b=$('#pay');b.disabled=true;b.textContent='מעבד...';try{const s=(await sb.auth.getSession()).data.session;
  const r=await fetch('/api/payments',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({product:id,idem})});
  if(!r.ok)throw 0;await loadAccess();el(`<h1>✅ בוצע (הדמיה)</h1><p>${it.kind==='subscription'?'המנוי הופעל.':'נוסף קרדיט לשיחה עם אח גדול.'}</p><button class="p" id="go">המשך</button>`);
  $('#go').onclick=()=>{if(acc&&acc.active)location.reload();else plans('תקופת הניסיון הסתיימה');};}
  catch(e){b.disabled=false;b.textContent='אישור תשלום (הדמיה)';alert('משהו השתבש, נסה/י שוב.');}};}
async function logout(){await sb.auth.signOut();location.reload();}
async function after(){
 user=(await sb.auth.getUser()).data.user;if(!user)return login('up');
 const b=await api('/api/bootstrap',{method:'POST'});prof=b.profile;if(!prof){el('<p>שגיאה בטעינת הפרופיל, נסה/י לרענן.</p>');return;}
 if(!prof.onboarding_done)return onboarding();
 feed(prof.onboarding||{},false);
 const a=await loadAccess();
 // Fail-open on server error so the chat (and its client-side crisis layer) is never blocked by an outage; paywall only on an explicit server verdict.
 if(a&&a.active===false)return paywall();
 const d=a?a.days_left:null;
 gate.style.display='none';
 // AI layer (server-side OpenAI via /api/ai). Only when the server explicitly says active; any failure -> null -> rule engine.
 if(a&&a.active)window.BBAuth.aiCall=async body=>{try{const s=(await sb.auth.getSession()).data.session;if(!s)return null;const c=new AbortController(),tm=setTimeout(()=>c.abort(),15000);
  const r=await fetch('/api/ai',{method:'POST',signal:c.signal,headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});clearTimeout(tm);
  if(r.status===402||r.status===401){window.BBAuth.aiCall=null;return null;}return r.ok?await r.json():null;}catch(e){return null;}};const t=document.querySelector('.title small');let bd=document.getElementById('trialBadge');
 if(!bd){bd=document.createElement('span');bd.id='trialBadge';t.appendChild(bd);}bd.textContent=prof.is_admin?'מנהל':(d==null?'':'נשארו '+d+' ימי ניסיון');
 const menu=document.getElementById('menu');if(!document.getElementById('logoutBtn')){const lo=document.createElement('button');lo.id='logoutBtn';lo.textContent='🚪 התנתקות';lo.onclick=logout;menu.appendChild(lo);const pb=document.createElement('button');pb.textContent='💳 מנוי ושיחות';pb.onclick=()=>plans('מנוי ושיחות');menu.appendChild(pb);
  if(prof.is_admin){const ad=document.createElement('button');ad.textContent='🛠️ ניהול';ad.onclick=()=>location.href='/admin';menu.appendChild(ad);}}
}
// Handoff: the SERVER builds the summary from allowlisted onboarding fields and enforces the cap (RPC request_handoff).
// The client only sends enum metadata (topic key, sub key, stage, auto flag, turn count) - never conversation text.
window.BBAuth={onHandoff:async function(eng,res){try{if(!sb||!user)return;
 const r=await sb.rpc('request_handoff',{theme:eng.s.topic||null,subtheme:eng.s.sub||null,stage:eng.s.stage||null,auto:!!(res&&res.auto),turns:eng.turns.length});
 if(r.error||!r.data)return;if(r.data.status)cacheHandoffs(r.data.status.handoffs);
 if(r.data.status)acc=r.data.status;if(r.data.ok&&r.data.paid_with_credit&&window.bbBubble)window.bbBubble({text:'השתמשנו בקרדיט אחד לשיחה עם אח גדול. נשארו '+((r.data.status||{}).credits||0)+'.',kind:'note'},'bot');
 if(r.data.ok===false&&(r.data.reason==='cap'||r.data.reason==='no_credit')&&window.bbBubble)window.bbBubble({text:'עדכון: הגעת למכסת ההעברות לגורם אנושי לתקופה הזו, אז הבקשה הזו לא נשלחה. אפשר לרכוש שיחה חד־פעמית בתפריט ⋮ ← "מנוי ושיחות". נמשיך כאן ביחד. במצוקה? ער"ן 1201.',kind:'note'},'bot');}catch(e){}}};
(async()=>{el('<p>טוען...</p>');try{const c=await fetch('/api/config').then(r=>r.json());
 sb=window.supabase.createClient(c.url,c.anonKey);window.bbSupabase=sb;
 const s=(await sb.auth.getSession()).data.session;if(s)after();else login('up');}catch(e){el('<p>אין חיבור לשרת כרגע.</p>');}})();
}
const sc=document.createElement('script');sc.src='/supabase.js';sc.onload=boot;sc.onerror=()=>{};document.head.appendChild(sc);
})();
</script></body></html>
